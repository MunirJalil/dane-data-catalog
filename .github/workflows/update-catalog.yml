name: Update DANE catalog

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Each source rebuilds independently so one blocked source does not
      # clobber the other. An app token is optional but recommended for
      # datos.gov.co: GitHub runner IPs are datacenter IPs and Socrata may
      # rate-limit/block anonymous traffic from them.
      - name: Rebuild datos.gov.co datasets
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python -m dane_catalog.cli --app-token "$SOCRATA_APP_TOKEN" \
            catalog --source socrata --full-sweep \
            || python -m dane_catalog.cli --proxy rotate \
            catalog --source socrata --full-sweep \
            || echo "::warning::datos.gov.co rebuild failed; keeping previous files"

      # Best-effort: microdatos.dane.gov.co blocks datacenter IPs (including
      # GitHub runners) with HTTP 401/403, so this step usually falls through
      # to the warning and the committed microdata snapshot is kept. To
      # refresh studies, run the CLI from a residential connection and PR
      # the result.
      - name: Rebuild microdata studies (best effort)
        run: |
          python -m dane_catalog.cli catalog --source microdata \
            || python -m dane_catalog.cli --proxy rotate \
            catalog --source microdata \
            || echo "::warning::microdatos rebuild failed; keeping previous files"

      - name: Commit changes
        run: |
          git config user.name "dane-catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalog/
          git diff --cached --quiet \
            || git commit -m "chore: refresh DANE catalog $(date -u +%F)"
          git push
